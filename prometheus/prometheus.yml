global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'fastapi-backend'
    metrics_path: '/metrics'
    scrape_interval: 5s
    static_configs:
      - targets: ['api1:8000', 'api2:8000', 'api3:8000']
        labels:
          app: 'fastapi-telemetry'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
