services:
  db:
    image: postgres:16
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: telemetry
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d telemetry"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"

  api1:
    build: .
    environment:
      DATABASE_URL: postgresql+pg8000://appuser:apppass@db:5432/telemetry
    depends_on:
      db:
        condition: service_healthy

  api2:
    build: .
    environment:
      DATABASE_URL: postgresql+pg8000://appuser:apppass@db:5432/telemetry
    depends_on:
      db:
        condition: service_healthy

  api3:
    build: .
    environment:
      DATABASE_URL: postgresql+pg8000://appuser:apppass@db:5432/telemetry
    depends_on:
      db:
        condition: service_healthy
        
  nginx:
    image: nginx:latest
    ports:
      - "8000:80"
      - "8443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api1
      - api2
      - api3

volumes:
  pg_data:
